<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" style="max-width:360px;">
    <h1>Admin Login</h1>
    {{ERROR_BLOCK}}
    <form method="POST" action="/admin/login">
      <input type="text" name="username" placeholder="Username" autocomplete="username" required style="margin-bottom:8px;width:100%;">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required style="margin-bottom:8px;width:100%;">
      <button type="submit" style="width:100%;">Log in</button>
    </form>
  </div>
</body>
</html>
